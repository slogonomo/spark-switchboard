[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-switchboard"
version = "0.1.0"
description = "On-demand front door for the model services on one NVIDIA DGX Spark (unofficial)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "slogonomo" }]
keywords = ["dgx-spark", "gb10", "unified-memory", "llm", "comfyui", "proxy", "scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "multidict",
    "yarl",
]

[project.scripts]
spark-switchboard = "spark_switchboard.__main__:main"

[tool.setuptools]
packages = ["spark_switchboard", "spark_switchboard.adapters"]

[tool.setuptools.package-data]
spark_switchboard = ["web/*.html"]
